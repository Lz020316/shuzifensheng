[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-test-agent"
version = "0.1.0"
description = "A lightweight automation testing agent project."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Auto Test Agent" }
]
dependencies = [
  "fastapi>=0.116.1",
  "pydantic>=2.11.9",
  "uvicorn>=0.35.0"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.1",
  "pytest>=8.4.2"
]
playwright = [
  "playwright>=1.55.0"
]

[project.scripts]
auto-test-agent = "test_agent.cli:main"
auto-test-agent-api = "test_agent.server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
